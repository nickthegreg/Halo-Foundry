<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A touch-first factory game: drill a small moon, belt and assemble parts, and grow a power grid around a star.">
<title>Halo Foundry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Michroma&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<canvas id="world" aria-label="Factory world"></canvas>

<div class="hud">
  <div class="row">
    <button class="orrery glass" id="orreryBtn" aria-label="Milestones"><canvas id="orrery" width="120" height="120"></canvas></button>
    <button class="goal glass" id="goalBtn" aria-label="Current milestone">
      <div class="goal-head"><span class="eyebrow" id="goalEyebrow">Milestone 1/6</span><span class="goal-name" id="goalName">First Light</span></div>
      <div class="reqs" id="goalReqs"></div>
    </button>
    <button class="iconbtn glass" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="row">
    <button class="power glass" id="powerBox" aria-label="Power">
      <div class="top"><svg viewBox="0 0 12 12"><path d="M7 0 1.5 7H5.5L4.5 12 10.5 4.5H6.5Z" fill="#f3c25a"/></svg><span id="pwText">0 / 120 kW</span></div>
      <div class="meter"><b id="pwBar"></b></div>
      <div class="sub"><span id="pwDay">Day</span><span id="pwSat"></span></div>
    </button>
    <div class="inv glass" id="inv"></div>
    <button class="iconbtn glass" id="mapBtn" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
  </div>
</div>

<div class="dock">
  <div class="dock-top">
    <div class="pastebar glass" id="pasteBar" hidden><span id="pasteInfo"></span><button class="btn" data-pb="rot">Rotate</button><button class="btn" data-pb="cancel">Cancel</button><button class="btn primary" data-pb="place">Place</button></div>
    <div class="tip glass" id="tip" hidden></div>
    <button class="rot glass" id="beltModeBtn" hidden aria-label="Conveyor mode">Line</button>
    <button class="rot glass" id="rotBtn" aria-label="Rotate" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg></button>
  </div>
  <div class="band"><div class="tools" id="tools"></div></div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div class="toast glass hide" id="toast"></div>
<div class="banner" id="banner" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
